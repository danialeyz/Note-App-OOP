<!DOCTYPE html>
<html lang="en" data-theme="dracula">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A beautiful, productive note-taking app" />
    <meta name="theme-color" content="#bd93f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NotePad" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="stylesheet" href="/public/build/tailwind.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>NotePad</title>
    <script>
      const theme = localStorage.getItem("notes-app-theme");
      if (theme) document.documentElement.setAttribute("data-theme", theme);
    </script>
  </head>
  <body class="h-screen w-screen overflow-hidden" style="font-family: 'Inter', sans-serif;">
    <div class="flex flex-col md:flex-row h-screen w-full" id="app">
      <div class="flex items-center justify-center h-screen w-full">
        <span class="loading loading-spinner loading-lg text-primary"></span>
      </div>
    </div>
    <script src="/src/js/main.js" type="module"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
